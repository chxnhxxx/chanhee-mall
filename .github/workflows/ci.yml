# [쉬운 설명] GitHub 에 코드를 올릴 때마다 자동으로 돌아가는 검사 목록(CI).
# 린트 → 타입검사 → 테스트 → 빌드 → E2E → 보안감사 순서로 실행됩니다.
# 리뷰 순서: 9단계 (docs/REVIEW_GUIDE.md 참고)

# 푸시·PR 마다 검사: 린트 → 타입검사 → 단위 테스트 → 빌드 → E2E → 보안 감사
# 외부 서비스 키 없이 "메모리 DB + 모의 결제" 모드로 돌아갑니다.
# [미확인] 액션 버전은 메이저 태그(@v4 등)로 적었습니다. 더 엄격하게 하려면 커밋 SHA 로 고정하세요(Dependabot 이 갱신).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_BACKEND: memory
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # package.json 의 packageManager 버전 사용

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Security audit (prod deps, high+)
        run: pnpm audit:ci
