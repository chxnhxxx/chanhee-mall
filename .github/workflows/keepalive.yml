# [쉬운 설명] 매일 한 번 사이트를 '깨우는' 자동 작업. Supabase 무료 DB 가 7일간 쓰이지 않으면 잠드는 것을 막습니다.
# 리뷰 순서: 9단계 (docs/REVIEW_GUIDE.md 참고)

# 매일 한 번 사이트의 /api/health 를 호출 → Supabase 에 실제 조회가 한 번 일어남
# 목적: Supabase 무료 프로젝트는 7일간 활동이 없으면 일시정지됨 → 이를 방지
# [미확인] Supabase 가 정확히 무엇을 "활동"으로 세는지는 공식 기준 확인 필요
# 필요한 GitHub Secrets:
#   SITE_URL     예) https://chanhee-mall.vercel.app
name: Keep-alive ping

on:
  schedule:
    - cron: "17 0 * * *" # 매일 09:17 KST (UTC 00:17). 정각은 GitHub 이 붐벼서 피함
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL 시크릿이 없어 건너뜁니다 (배포 후 설정하세요)."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "$SITE_URL/api/health"
